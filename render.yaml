services:
  - type: web
    name: meeting-intelligence-service
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromValue: file:/data/dev.db
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
